name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: Build e testes unitários
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache de pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Rodar testes
        run: >
          dotnet test Learnly.Tests/Learnly.Tests.csproj
          --no-build -c Release
          --logger "trx;LogFileName=testes.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"
          --settings Learnly.Tests/coverlet.runsettings

      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-testes
          path: TestResults
          retention-days: 14

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: testes
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      # O Dockerfile roda `dotnet test` no estágio de build: se um teste
      # quebrar aqui, quebra igual no Render e o deploy não acontece.
      - name: Build da imagem
        run: docker build -t learnly-api:ci .
